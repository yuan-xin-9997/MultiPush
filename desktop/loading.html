<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MultiPush</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, -apple-system, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #1f2937;
        background:
          radial-gradient(900px 480px at 100% -10%, rgba(0, 185, 107, 0.14), transparent 60%),
          radial-gradient(700px 420px at -10% 110%, rgba(0, 185, 107, 0.1), transparent 55%),
          #f7f8fa;
      }
      .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .logo { width: 68px; height: 68px; filter: drop-shadow(0 10px 22px rgba(0, 185, 107, 0.3)); }
      .name { margin: 0; font-size: 20px; letter-spacing: 0.02em; }
      .hint { margin: 0; color: #6b7280; font-size: 13px; }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(0, 185, 107, 0.22);
        border-top-color: #00b96b;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="./build/icon.png" alt="" />
      <h1 class="name">MultiPush</h1>
      <div class="spinner" aria-hidden="true"></div>
      <p class="hint">正在连接你的发布系统…</p>
    </div>
  </body>
</html>
