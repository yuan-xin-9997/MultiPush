name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的发布标签，例如 v2.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: multipush-desktop-windows
            package: npm --prefix desktop run dist:win
          - name: macOS Universal
            os: macos-latest
            artifact: multipush-desktop-macos
            package: npm --prefix desktop run dist:mac
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-45.2.2
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run desktop:check
      - run: npm run desktop:smoke
      - name: Package desktop client
        run: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: multipush-desktop-*
          path: dist
          merge-multiple: true

      - name: Resolve and verify release tag
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          export TAG VERSION
          node -e "const p=require('./desktop/package.json'); if (p.version !== process.env.VERSION) { console.error('desktop/package.json version ' + p.version + ' does not match tag ' + process.env.TAG); process.exit(1) }"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create release when missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be uploaded to it."
            exit 0
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## MultiPush 桌面客户端 ${TAG}

          Windows 与 macOS **完全本地版**。安装后无需连接任何服务器：后端、前端、SQLite 数据库和上传文件都在本机运行和保存。

          ### 下载

          - Windows x64：\`MultiPush-Setup-${VERSION}-x64.exe\`（安装版）或 \`MultiPush-Portable-${VERSION}-x64.exe\`（便携版）
          - macOS Universal（Intel / Apple Silicon）：\`MultiPush-${VERSION}-universal.dmg\` 或 \`MultiPush-${VERSION}-universal-mac.zip\`

          ### 数据位置

          - Windows：\`%APPDATA%\\MultiPush\\data\`
          - macOS：\`~/Library/Application Support/MultiPush/data\`
          - 客户端菜单「本地服务 → 打开数据目录」可直接打开。
          - 升级或卸载应用不会自动删除该目录；备份时复制整个 \`data\` 目录即可。

          ### 安装说明

          - Windows 安装包暂未使用商业代码签名证书。SmartScreen 提示时选择「更多信息」→「仍要运行」。
          - macOS 安装包未签名、未公证。打开 DMG 后将 MultiPush 拖入「应用程序」，首次启动请右键点击图标选择「打开」；也可执行：
            \`xattr -dr com.apple.quarantine /Applications/MultiPush.app\`
          - 首次启动直接注册本地账号，不需要邮箱验证码，也不需要配置 SMTP。
          - 自动发布功能需要本机安装 Chrome 或 Edge；不安装仍可编辑、渲染和导出。

          ### 从在线版迁移

          - 在在线版导出文档 / ZIP，再在本地版内容库导入即可保留文档内容。
          - 如需完整迁移账号、素材和平台登录会话，可在关闭应用后，将服务器 \`.data\` 目录内容复制到本机数据目录。

          ### 校验

          下载 \`SHA256SUMS.txt\` 后可核对安装包：

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF
          gh release create "$TAG" \
            --title "MultiPush 本地桌面版 $TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          files=$(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) | sort)
          test -n "$files"
          echo "$files" | while IFS= read -r file; do
            test -n "$file" || continue
            gh release upload "$TAG" "$file" --clobber
          done

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          echo "Release assets:"
          gh release view "$TAG" --json assets --jq '.assets[].name'
