name: Desktop check

on:
  push:
    paths:
      - "desktop/**"
      - "server/**"
      - "web/**"
      - "shared/**"
      - "scripts/build-desktop.mjs"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "server/**"
      - "web/**"
      - "shared/**"
      - "scripts/build-desktop.mjs"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-45.2.2
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run desktop:check
      - run: npm run desktop:smoke
